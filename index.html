  <script>
    (function () {
      function slugify(value) {
        return value
          .toLowerCase()
          .trim()
          .replace(/[^a-z0-9]+/g, '-')
          .replace(/^-+|-+$/g, '');
      }

      function getSectionTitle(heading) {
        var titleSpan = heading.querySelector('span:not(.subtitle)');
        return titleSpan ? titleSpan.textContent.trim() : heading.textContent.trim();
      }

      function renderResearchTopicLinks() {
        var researchRoot = document.querySelector('app-research');
        if (!researchRoot) return;

        var sections = Array.prototype.slice.call(
          researchRoot.querySelectorAll(':scope > div.section')
        );
        if (!sections.length) return;

        var items = [];
        sections.forEach(function (section, index) {
          var heading = section.querySelector('h4');
          if (!heading) return;
          var title = getSectionTitle(heading);
          if (!title) return;

          var baseId = 'research-topic-' + (slugify(title) || String(index + 1));
          var sectionId = baseId;
          var suffix = 2;
          while (document.getElementById(sectionId) && document.getElementById(sectionId) !== section) {
            sectionId = baseId + '-' + suffix;
            suffix += 1;
          }

          section.id = sectionId;
          items.push({ id: sectionId, title: title });
        });

        if (!items.length) return;

        var nav = researchRoot.querySelector(':scope > nav.research-topics');
        if (!nav) {
          nav = document.createElement('nav');
          nav.className = 'research-topics';
          nav.setAttribute('aria-label', 'Research topics');
          researchRoot.insertBefore(nav, researchRoot.firstChild);
        }

        nav.innerHTML = '';

        var title = document.createElement('p');
        title.className = 'research-topics-title';
        title.textContent = 'Jump to topic';
        nav.appendChild(title);

        var list = document.createElement('ul');
        list.className = 'research-topics-list';
        items.forEach(function (item) {
          var listItem = document.createElement('li');
          var link = document.createElement('a');
          link.href = '#' + item.id;
          link.textContent = item.title;
          listItem.appendChild(link);
          list.appendChild(listItem);
        });

        nav.appendChild(list);
      }

      function scheduleRender() {
        window.requestAnimationFrame(renderResearchTopicLinks);
      }

      document.addEventListener('DOMContentLoaded', scheduleRender);
      window.addEventListener('popstate', scheduleRender);
      window.addEventListener('hashchange', scheduleRender);

      var observer = new MutationObserver(scheduleRender);
      observer.observe(document.body, { childList: true, subtree: true });
    })();
  </script>
